[build]
  command = "pnpm build"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--version"

# Wouter client-side routes need to fall back to the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[headers]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public,max-age=31536000,immutable"

  for = "/index.html"
  [headers.values]
    Cache-Control = "public,max-age=0,must-revalidate"
